<?xml version="1.0" encoding="UTF-8"?>
<!-- The home page scene: low-poly hills, a smeltery with steam, a sun and a few pines. Drawn by hand for castanea.
     The launcher paints these shapes itself (crates/ui/src/scene.rs), so only convex polygons, rects, circles and
     ellipses with a flat fill and an opacity are used; the colours stay close to the page so text stays readable. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Hills and a smeltery at dusk</title>
  <!-- sun -->
  <circle cx="170" cy="150" r="86" fill="#a3602f" opacity="0.05"/>
  <circle cx="170" cy="150" r="56" fill="#a3602f" opacity="0.24"/>
  <!-- far hills -->
  <polygon points="0,300 150,236 300,300 300,480 0,480" fill="#201e1b"/>
  <polygon points="150,236 300,300 150,300" fill="#252320"/>
  <polygon points="250,300 420,214 570,290 570,480 250,480" fill="#201e1b"/>
  <polygon points="420,214 570,290 420,290" fill="#252320"/>
  <polygon points="520,290 700,230 880,300 880,480 520,480" fill="#201e1b"/>
  <polygon points="700,230 880,300 700,300" fill="#252320"/>
  <polygon points="830,300 960,250 960,480 830,480" fill="#201e1b"/>
  <polygon points="0,300 150,236 80,300" fill="#1d1b19"/>
  <polygon points="250,300 420,214 340,300" fill="#1d1b19"/>
  <!-- smeltery: chimney, steam, hall, roof, door -->
  <polygon points="656,350 664,226 684,226 692,350" fill="#2b2824"/>
  <rect x="660" y="216" width="28" height="10" fill="#2f2b27"/>
  <rect x="659" y="268" width="30" height="5" fill="#a3602f" opacity="0.40"/>
  <circle cx="676" cy="198" r="9" fill="#8a847d" opacity="0.14"/>
  <circle cx="688" cy="172" r="13" fill="#8a847d" opacity="0.11"/>
  <circle cx="680" cy="140" r="17" fill="#8a847d" opacity="0.09"/>
  <circle cx="698" cy="102" r="22" fill="#8a847d" opacity="0.07"/>
  <circle cx="722" cy="62" r="27" fill="#8a847d" opacity="0.05"/>
  <rect x="598" y="312" width="124" height="62" fill="#2a2723"/>
  <polygon points="588,314 660,278 732,314" fill="#302c28"/>
  <rect x="616" y="336" width="20" height="38" fill="#a3602f" opacity="0.34"/>
  <rect x="690" y="330" width="18" height="12" fill="#a3602f" opacity="0.20"/>
  <!-- middle hills -->
  <polygon points="0,372 140,326 320,376 320,480 0,480" fill="#262320"/>
  <polygon points="140,326 320,376 140,376" fill="#2b2824"/>
  <polygon points="280,376 480,336 660,372 660,480 280,480" fill="#262320"/>
  <polygon points="480,336 660,372 480,372" fill="#2b2824"/>
  <polygon points="600,374 790,330 960,366 960,480 600,480" fill="#262320"/>
  <polygon points="790,330 960,366 790,366" fill="#2b2824"/>
  <!-- pines on the middle hills -->
  <rect x="87" y="352" width="6" height="16" fill="#1f1d1a"/>
  <polygon points="72,358 90,318 108,358" fill="#2a2d27"/>
  <polygon points="76,340 90,306 104,340" fill="#2f322b"/>
  <rect x="127" y="356" width="5" height="14" fill="#1f1d1a"/>
  <polygon points="115,362 130,328 145,362" fill="#2a2d27"/>
  <rect x="838" y="342" width="5" height="14" fill="#1f1d1a"/>
  <polygon points="826,348 841,312 856,348" fill="#2a2d27"/>
  <polygon points="830,330 841,300 852,330" fill="#2f322b"/>
  <!-- front hills -->
  <polygon points="0,432 210,392 440,430 440,480 0,480" fill="#2d2a26"/>
  <polygon points="210,392 440,430 210,430" fill="#32302b"/>
  <polygon points="400,430 620,396 830,428 830,480 400,480" fill="#2d2a26"/>
  <polygon points="620,396 830,428 620,428" fill="#32302b"/>
  <polygon points="790,428 960,402 960,480 790,480" fill="#2d2a26"/>
  <!-- pines on the front hills -->
  <rect x="297" y="398" width="7" height="18" fill="#22201d"/>
  <polygon points="280,406 300,358 320,406" fill="#2c2f29"/>
  <polygon points="285,384 300,346 315,384" fill="#31342d"/>
  <rect x="337" y="406" width="6" height="16" fill="#22201d"/>
  <polygon points="324,412 340,372 356,412" fill="#2c2f29"/>
  <rect x="897" y="400" width="6" height="16" fill="#22201d"/>
