[package]
name = "castanea-launcher"
description = "Native launcher, mod browser and mod manager for castanea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
castanea-launcher-core.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "clipboard", "default_fonts", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image.workspace = true
rfd = "0.15"

[dev-dependencies]
tempfile.workspace = true
