[workspace]
resolver = "3"
members = ["crates/core", "crates/ui"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/TerraNuxt/castanea-launcher"

[workspace.dependencies]
castanea-launcher-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tempfile = "3"
tiny_http = "0.12"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
